<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ProjectHubV2</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <header class="app-header">
      <div class="brand-block">
        <p class="eyebrow">ProjectHubV2</p>
        <h1>プロジェクト管理</h1>
      </div>
      <nav class="top-nav" aria-label="主要画面">
        <a href="/">概要</a>
        <a href="/project/manage/incomplete/list/default">未完了一覧</a>
        <a href="/project/manage/incomplete/gantt/default">ガント</a>
        <a href="/project/management/calender/default">カレンダー</a>
        <a href="/api/routes">API</a>
      </nav>
    </header>

    <main class="app-shell">
      <section class="summary-grid" aria-label="サマリー">
        <article class="metric-card">
          <span class="metric-label">プロジェクト</span>
          <strong id="projectCount">-</strong>
        </article>
        <article class="metric-card">
          <span class="metric-label">DB テーブル</span>
          <strong id="tableCount">-</strong>
        </article>
        <article class="metric-card">
          <span class="metric-label">互換ルート</span>
          <strong id="routeCount">-</strong>
        </article>
      </section>

      <section class="content-grid">
        <section class="panel project-panel" aria-labelledby="projectListTitle">
          <div class="section-heading">
            <div>
              <p class="eyebrow" id="currentPath">/</p>
              <h2 id="projectListTitle">プロジェクト一覧</h2>
            </div>
            <button class="refresh-button" type="button" id="refreshButton">更新</button>
          </div>
          <div id="warnings" class="warnings" hidden></div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>プロジェクト ID</th>
                  <th>プロジェクト名</th>
                  <th>顧客</th>
                  <th>状態</th>
                </tr>
              </thead>
              <tbody id="projectRows"></tbody>
            </table>
          </div>
          <div class="empty-state" id="emptyState" hidden>
            <h3>表示できるプロジェクトがありません</h3>
            <p>現在の Rust 版は、MCP 取得済みスナップショットを表示しています。</p>
          </div>
        </section>

        <aside class="panel route-panel" aria-labelledby="routeTitle">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Migration</p>
              <h2 id="routeTitle">移植状況</h2>
            </div>
          </div>
          <div class="route-list" id="routeList"></div>
        </aside>
      </section>

      <section class="panel db-panel" aria-labelledby="databaseTitle">
        <div class="section-heading">
          <div>
            <p class="eyebrow" id="sourcePill">データ取得元</p>
            <h2 id="databaseTitle">DB テーブル</h2>
          </div>
        </div>
        <div class="table-chips" id="projectTables"></div>
        <ul class="db-list" id="databaseTables"></ul>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
