[package]
name = "ProjectHubV2"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = "1.42.0"
tokio = { version = "1", features = ["full"] }
sqlx = { version = "0.8", features = [
    "mysql",
    "runtime-tokio-rustls",
    "chrono",
    "rust_decimal",
    "macros"
] }
anyhow = "1"
chrono = "0.4"