[package]
name = "ProjectHubV2"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-web = "4"
serde = { version = "1", features = ["derive"] }
rust_decimal = "1.42.0"
sqlx = { version = "0.8", features = [
    "mysql",
    "runtime-tokio-rustls",
    "chrono",
    "rust_decimal",
    "macros"
] }
chrono = { version = "0.4", features = ["serde"] }
